  @font-face { font-family: 'LIL'; src: url('fonts/LilitaOne.woff2'); }
  @font-face { font-family: 'BOW'; src: url('fonts/BowlbyOne.woff2'); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #stage canvas { position: absolute; inset: 0; display: block; }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  #dip { background: #0A6AAE; opacity: 0; }
  #flash { background: #fff; opacity: 0; }

  .bow { font-family: 'BOW', sans-serif; }
  .red { color: #F23A3C; }
  /* hook */
  #haus { top: 63%; font-size: calc(var(--u) * 210); line-height: 1; color: #fff; -webkit-text-stroke: calc(var(--u)*10) #FF7A00; paint-order: stroke fill; text-shadow: 0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.45); }
  /* brand reveal */
  #menuBaru { top: 27.6%; }
  .pill { display: inline-block; font-family: 'LIL'; font-size: calc(var(--u) * 40); letter-spacing: .06em; color: #fff; background: #F23A3C; padding: calc(var(--u)*10) calc(var(--u)*30); border-radius: calc(var(--u)*60); box-shadow: 0 calc(var(--u)*8) calc(var(--u)*20) rgba(0,40,90,.25); }

  #tagline { left: 5%; right: auto; width: 38%; top: 51.5%; text-align: left; font-size: calc(var(--u) * 44); line-height: 1.02; color: #F23A3C; transform-origin: 0 50%; }
  #tagline .sw { display:block; height: calc(var(--u)*8); margin-top: calc(var(--u)*12); background: #F23A3C; border-radius: 99px; transform-origin: 0 50%; }
  /* end card */
  #endIG { top: 26.6%; }
  #endIG span { display: inline-flex; align-items: center; gap: calc(var(--u)*12); font-family: 'LIL'; font-size: calc(var(--u)*40); color: #fff; background: rgba(5,60,110,.35); padding: calc(var(--u)*8) calc(var(--u)*26); border-radius: 99px; }
  #endTag { top: 32%; font-size: calc(var(--u) * 64); line-height: 1.02; color: #fff; text-shadow: 0 calc(var(--u)*6) 0 #D9262E, 0 calc(var(--u)*14) calc(var(--u)*24) rgba(0,40,90,.35); }
  #endTag .y { color: #E4F542; }
  #endInfo { top: 43.4%; }
  #endInfo .box { display: inline-block; background: #fff; border-radius: calc(var(--u)*34); padding: calc(var(--u)*18) calc(var(--u)*36); box-shadow: 0 calc(var(--u)*12) calc(var(--u)*30) rgba(0,40,90,.3); }
  #endInfo .d { font-family: 'LIL'; font-size: calc(var(--u)*46); color: #F23A3C; letter-spacing: .02em; }
  #endInfo .e { font-family: 'IDX'; font-weight: 800; font-size: calc(var(--u)*29); color: #0B3A6E; letter-spacing: .04em; margin-top: calc(var(--u)*6); }

</div>
